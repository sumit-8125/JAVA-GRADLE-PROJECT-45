name: JAVA GRADLE AUTOMATE THE DEPLOYMENT

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run tests with Gradle
        run: ./gradlew test

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-application
          path: build/libs/*.jar

      - name: Docker image build
        run: docker build -t ghcr.io/${{ github.repository_owner }}/java-gradle-app:latest .

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker push
        run: docker push ghcr.io/${{ github.repository_owner }}/java-gradle-app:latest


  deploy:

    needs: build

    runs-on: self-hosted

    steps:

      - name: Deploy
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/java-gradle-app:latest
          docker stop java-gradle-app || true
          docker rm java-gradle-app || true
          docker run -d --name java-gradle-app -p 8080:8080 ghcr.io/${{ github.repository_owner }}/java-gradle-app:latest